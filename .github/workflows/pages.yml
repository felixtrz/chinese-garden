# Builds the garden and publishes it to GitHub Pages at https://felixtrz.github.io/chinese-garden/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # install scripts only fetch tooling binaries (onnxruntime, metavr) the build does not need
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # a project site lives under /chinese-garden/; plain `npm run build` stays at the domain root
      - run: npm run build -- --base=/chinese-garden/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
